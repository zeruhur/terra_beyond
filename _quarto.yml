project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - "docs/**/*.md"
    - "docs/**/*.qmd"

website:
  title: "My Quarto Site"
  description: "A beautiful multi-format Quarto website template"
  site-url: "https://<username>.github.io/<repo-name>/"
  repo-url: "https://github.com/<username>/<repo-name>"
  repo-actions: [issue]

  navbar:
    left:
      - text: "Home"
        href: index.html
      - text: "Example Document"
        href: docs/example-document.html
      - text: "About"
        href: docs/about.html
    right:
      - icon: github
        href: https://github.com/<username>/<repo-name>

  favicon: docs/assets/logo.svg

  page-footer:
    left: "© {year} [Your Name](https://yourwebsite.com)"
    right: "Built with [Quarto](https://quarto.org)"

brand: _brand.yml

filters:
  - _extensions/gfm-callout.lua
  - _extensions/typst-pagebreak-h1.lua

format:
  html:
    theme:
      light: [materia, assets/custom.scss]
      dark:  [darkly, assets/custom.scss]
    toc: true
    toc-depth: 3
    include-in-header: assets/fonts.html
    include-after-body: assets/format-links-top.html
