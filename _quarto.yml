project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - "docs/**/*.md"
    - "docs/**/*.qmd"

website:
  title: "Terra Beyond"
  description: "A rules-light sci-fi roleplaying anthology across three cosmic ages"
  site-url: "https://zeruhur.github.io/terra_beyond/"
  repo-url: "https://github.com/zeruhur/terra_beyond"
  repo-actions: [issue]

  navbar:
    left:
      - text: "Home"
        href: index.html
      - text: "Maps"
        href: docs/maps.html
      - text: "Sol: Beyond Earth"
        href: docs/sol-beyond-earth.html
      - text: "Frontier: Beyond Sol"
        href: docs/frontier-beyond-sol.html
      - text: "Orion: Beyond the Frontier"
        href: docs/orion-beyond-the-frontier.html
      - text: "Timeline"
        href: docs/terra_beyond_timeline.html
      - text: "Calendar"
        href: docs/sol_union_calendar.html
      - text: "About"
        href: docs/about.html
    right:
      - icon: github
        href: https://github.com/zeruhur/terra_beyond

  favicon: docs/assets/icon.svg

  page-footer:
    left: "© 2023-2026 [Roberto Bisceglie](https://github.com/zeruhur)"
    right: "Built with [Quarto](https://quarto.org)"

brand: _brand.yml

filters:
  - _extensions/gfm-callout.lua
  - _extensions/typst-pagebreak-h1.lua

format:
  html:
    theme:
      light: [materia, assets/custom.scss]
      dark:  [darkly, assets/custom.scss]
    toc: true
    toc-depth: 3
    include-in-header: assets/fonts.html
    include-after-body: assets/format-links-top.html
    format-links:
      - format: typst
        text: PDF
        icon: file-pdf
      - odt
      - epub
      - gfm
