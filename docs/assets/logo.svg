<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="height: 512px; width: 512px;">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <!-- Background panel with gradient -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#grad1)" />
  
  <!-- Outer card representing document/publishing -->
  <rect x="128" y="112" width="256" height="288" rx="24" fill="#ffffff" />
  
  <!-- Minimalist lines on the document -->
  <rect x="168" y="160" width="176" height="24" rx="12" fill="url(#grad2)" />
  <rect x="168" y="216" width="176" height="16" rx="8" fill="#e2e8f0" />
  <rect x="168" y="256" width="128" height="16" rx="8" fill="#e2e8f0" />
  
  <!-- Floating accent circle representing focus / data -->
  <circle cx="340" cy="320" r="48" fill="url(#grad2)" />
</svg>