<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Sol System Map, 2090</title>
  <desc id="desc">Minimal black and white schematic map of the Sol System with major settled regions and routes.</desc>
  <rect width="1100" height="760" fill="#ffffff"/>
  <style>
    text{font-family:"Courier New",monospace;fill:#111}
    .small{font-size:11px}.tiny{font-size:9px;fill:#555}.label{font-size:13px;font-weight:700}
    .zone{font-size:10px;fill:#777;letter-spacing:2px}
    .orbit{fill:none;stroke:#c8c8c8;stroke-width:1;stroke-dasharray:4 8}
    .route{fill:none;stroke:#333;stroke-width:1.4;stroke-dasharray:6 7}
    .body{fill:#fff;stroke:#111;stroke-width:2}.settlement{fill:#111;stroke:#111;stroke-width:1.5}
    .outpost{fill:#fff;stroke:#111;stroke-width:1.5}
  </style>
  <text x="38" y="42" class="label">SOL SYSTEM, 2090</text>
  <text x="38" y="60" class="tiny">schematic routes and settled regions, not orbital scale</text>
  <g transform="translate(380 382)">
    <circle r="55" class="orbit"/><circle r="94" class="orbit"/><circle r="145" class="orbit"/>
    <circle r="210" class="orbit"/><circle r="300" class="orbit"/><circle r="395" class="orbit"/>
    <text x="-36" y="-326" class="zone">OUTER SETTLEMENTS</text>
    <text x="-28" y="-236" class="zone">BELT ROUTES</text>
    <text x="-20" y="-159" class="zone">INNER SYSTEM</text>
    <line x1="0" y1="0" x2="0" y2="-94" class="route"/>
    <line x1="0" y1="-94" x2="119" y2="-84" class="route"/>
    <line x1="119" y1="-84" x2="210" y2="0" class="route"/>
    <line x1="210" y1="0" x2="0" y2="300" class="route"/>
    <line x1="0" y1="300" x2="-210" y2="0" class="route"/>
    <line x1="210" y1="0" x2="300" y2="0" class="route"/>
    <line x1="300" y1="0" x2="395" y2="0" class="route"/>
    <circle cx="0" cy="0" r="16" fill="#111"/>
    <text x="-12" y="5" fill="#fff" font-size="13" font-family="Courier New,monospace" font-weight="700">Sol</text>
    <circle cx="0" cy="-55" r="5" class="body"/>
    <text x="14" y="-58" class="small">Mercury</text><text x="14" y="-46" class="tiny">survey sites</text>
    <circle cx="0" cy="-94" r="9" class="body"/>
    <text x="15" y="-99" class="label">Venus</text><text x="15" y="-84" class="small">Aphrodite City</text>
    <text x="15" y="-72" class="tiny">cloud habitats</text>
    <circle cx="119" cy="-84" r="10" class="body"/><circle cx="134" cy="-75" r="4" class="outpost"/>
    <text x="141" y="-91" class="label">Terra-Luna</text><text x="141" y="-76" class="small">Sol Union capital</text>
    <text x="141" y="-64" class="tiny">Luna-Center, Luna-5, New Shanghai</text>
    <circle cx="210" cy="0" r="9" class="body"/>
    <text x="226" y="-47" class="label">Mars</text><text x="226" y="-32" class="small">terraforming zone</text>
    <text x="226" y="-20" class="tiny">habitats, university, industry</text>
    <path d="M-62,292 C-25,277 30,277 68,293" fill="none" stroke="#111" stroke-width="2"/>
    <circle cx="-42" cy="294" r="3" class="settlement"/><circle cx="0" cy="300" r="4" class="settlement"/>
    <circle cx="42" cy="294" r="3" class="settlement"/>
    <text x="83" y="294" class="label">Belt</text><text x="83" y="309" class="small">Belt-1</text>
    <text x="83" y="321" class="tiny">mining colonies and free outposts</text>
    <circle cx="-210" cy="0" r="15" class="body"/>
    <circle cx="-232" cy="-12" r="4" class="outpost"/><circle cx="-230" cy="13" r="4" class="outpost"/>
    <text x="-345" y="-10" class="label">Jupiter</text><text x="-345" y="5" class="small">Europa-1</text>
    <text x="-345" y="17" class="tiny">Europa and Ganymede stations</text>
    <circle cx="300" cy="0" r="13" class="body"/><ellipse cx="300" cy="0" rx="25" ry="7" fill="none" stroke="#111" stroke-width="1.4"/>
    <circle cx="325" cy="16" r="4" class="outpost"/>
    <text x="342" y="42" class="label">Saturn</text><text x="342" y="57" class="small">Titan-1</text>
    <text x="342" y="69" class="tiny">methane extraction, Enceladus science</text>
    <circle cx="395" cy="0" r="7" class="body"/>
    <text x="410" y="-23" class="small">Uranus / Neptune</text><text x="410" y="-11" class="tiny">remote probes, sparse depots</text>
  </g>
  <g transform="translate(38 608)">
    <rect x="0" y="0" width="306" height="116" rx="4" fill="#fff" stroke="#aaa"/>
    <text x="14" y="19" class="zone">LEGEND</text>
    <circle cx="20" cy="38" r="6" class="body"/><text x="34" y="42" class="small">major world or settled region</text>
    <circle cx="20" cy="59" r="4" class="settlement"/><text x="34" y="63" class="small">named settlement or colony</text>
    <circle cx="20" cy="80" r="4" class="outpost"/><text x="34" y="84" class="small">research station, mine, or outpost</text>
    <line x1="14" y1="101" x2="42" y2="101" class="route"/><text x="50" y="105" class="small">regular transfer route</text>
  </g>
</svg>
