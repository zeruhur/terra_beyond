  <!-- Chara (primary) -->
  <polygon points="510,259 519,268 510,277 501,268" fill="black"/>
  <text x="523" y="263" fill="black" font-size="12" font-family="Courier New, monospace" font-weight="bold">Chara</text>
  <text x="523" y="276" fill="#555555" font-size="9" font-family="Courier New, monospace">Nova Terra Assembly</text>

  <!-- Zeta Reticuli -->
  <polygon points="388,519 394,525 388,531 382,525" fill="black"/>
  <text x="400" y="522" fill="#333333" font-size="10" font-family="Courier New, monospace">ζ Reticuli</text>
  <text x="400" y="533" fill="#666666" font-size="8.5" font-family="Courier New, monospace">Ark of Precursor Knowledge</text>

