  <!-- ═══════════════════════════════════════════
       STARS
       Symbols: ● Sol Union  ○ Sirius Compact
                ⊙ Zal-Terran Commonwealth  ◆ Nova Terra Assembly
                ▲ Orion Concordium  ■ Frontier Coalition
                ○ (small) Independent
       ═══════════════════════════════════════════ -->

  <!-- SOL UNION — filled circle ● -->

  <!-- Sol (primary) -->
  <circle cx="215" cy="305" r="8" fill="black"/>
  <text x="228" y="300" fill="black" font-size="12" font-family="Courier New, monospace" font-weight="bold">Sol</text>
  <text x="228" y="313" fill="#555555" font-size="9" font-family="Courier New, monospace">Sol Union</text>

  <!-- Alpha Centauri -->
  <circle cx="165" cy="385" r="4" fill="black"/>
  <text x="152" y="383" text-anchor="end" fill="#333333" font-size="10" font-family="Courier New, monospace">α Centauri</text>

  <!-- Keid -->
  <circle cx="178" cy="242" r="4" fill="black"/>
  <text x="165" y="240" text-anchor="end" fill="#333333" font-size="10" font-family="Courier New, monospace">Keid</text>

  <!-- SIRIUS COMPACT — outlined circle ○ -->

  <!-- Sirius (primary) -->
  <circle cx="300" cy="215" r="8" fill="white" stroke="black" stroke-width="2.5"/>
  <text x="313" y="210" fill="black" font-size="12" font-family="Courier New, monospace" font-weight="bold">Sirius</text>
  <text x="313" y="223" fill="#555555" font-size="9" font-family="Courier New, monospace">Sirius Compact</text>

  <!-- Vega -->
  <circle cx="450" cy="178" r="4.5" fill="white" stroke="black" stroke-width="2"/>
  <text x="462" y="175" fill="#333333" font-size="10" font-family="Courier New, monospace">Vega</text>

  <!-- INTERSTELLAR ALLIANCE — filled circle with white centre ⊙ -->

  <!-- Epsilon Eridani -->
  <circle cx="162" cy="450" r="4.5" fill="black"/>
  <circle cx="162" cy="450" r="1.5" fill="white"/>
  <text x="150" y="448" text-anchor="end" fill="#333333" font-size="10" font-family="Courier New, monospace">ε Eridani</text>

  <!-- Tau Ceti (primary) -->
  <circle cx="128" cy="508" r="6" fill="black"/>
  <circle cx="128" cy="508" r="2" fill="white"/>
  <text x="116" y="505" text-anchor="end" fill="#333333" font-size="10" font-family="Courier New, monospace">τ Ceti</text>
  <text x="116" y="516" text-anchor="end" fill="#555555" font-size="8.5" font-family="Courier New, monospace">Zal-Terran Commonwealth</text>

  <!-- INDEPENDENT — small open circle -->

  <!-- Luyten's Star -->
  <circle cx="268" cy="415" r="3.5" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="278" y="412" fill="#555555" font-size="9" font-family="Courier New, monospace">Luyten's Star</text>
  <text x="278" y="422" fill="#777777" font-size="8" font-family="Courier New, monospace">Tevkar homeworld ◆</text>

