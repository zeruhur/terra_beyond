       THREAT ZONE LABELS
       ═══════════════════════════════════════════ -->

  <text x="918" y="452" text-anchor="middle" fill="#333333" font-size="11" font-family="Courier New, monospace" font-weight="bold" letter-spacing="1">VARNON SWARM</text>
  <text x="918" y="466" text-anchor="middle" fill="#666666" font-size="8.5" font-family="Courier New, monospace">system-devouring hazard</text>

  <text x="948" y="148" text-anchor="middle" fill="#333333" font-size="11" font-family="Courier New, monospace" font-weight="bold" letter-spacing="1">ZYNTHARI SPACE</text>
  <text x="948" y="162" text-anchor="middle" fill="#666666" font-size="8.5" font-family="Courier New, monospace">ancient alien empire</text>

