  <text x="692" y="88" text-anchor="middle" fill="#aaaaaa" font-size="10" font-family="Courier New, monospace" letter-spacing="3">FRONTIER</text>
  <text x="912" y="88" text-anchor="middle" fill="#aaaaaa" font-size="10" font-family="Courier New, monospace" letter-spacing="3">DEEP RIM</text>

