  <polygon points="32,641 38,647 32,653 26,647" fill="black"/>
  <text x="41" y="650" fill="#333333" font-size="9" font-family="Courier New, monospace">Nova Terra Assembly</text>

  <circle cx="32" cy="664" r="3.5" fill="white" stroke="black" stroke-width="1.2"/>
