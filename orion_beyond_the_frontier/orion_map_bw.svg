  <polygon points="492,369 502,388 482,388" fill="black"/>
  <text x="506" y="374" fill="black" font-size="12" font-family="Courier New, monospace" font-weight="bold">Orionis Refuge</text>
  <text x="506" y="386" fill="#555555" font-size="9" font-family="Courier New, monospace">χ¹ Orionis</text>
  <text x="506" y="397" fill="#666666" font-size="8.5" font-family="Courier New, monospace">Orion Concordium</text>

