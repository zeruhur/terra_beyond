  <!-- ═══════════════════════════════════════════
       LEGEND
       ═══════════════════════════════════════════ -->
  <rect x="18" y="576" width="220" height="112" rx="4" fill="white" stroke="#aaaaaa" stroke-width="1"/>
  <text x="28" y="592" fill="#777777" font-size="9" font-family="Courier New, monospace" letter-spacing="2.5">STELLAR POLITIES</text>

  <!-- Left column -->
  <circle cx="32" cy="605" r="4" fill="black"/>
  <text x="41" y="608" fill="#333333" font-size="9" font-family="Courier New, monospace">Sol Union</text>

  <circle cx="32" cy="619" r="4" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="41" y="622" fill="#333333" font-size="9" font-family="Courier New, monospace">Sirius Compact</text>

  <circle cx="32" cy="633" r="4" fill="black"/>
  <circle cx="32" cy="633" r="1.5" fill="white"/>
