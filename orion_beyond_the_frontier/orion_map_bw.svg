<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700">
  <title>Orion's Arm — Human Space, c. 4000 CE</title>
  <defs>
    <!-- Hatching for Varnon Swarm (diagonal) -->
    <pattern id="varnonHatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
