  <text x="136" y="608" fill="#333333" font-size="9" font-family="Courier New, monospace">Orion Concordium</text>

  <rect x="120" y="614" width="8" height="8" fill="black"/>
  <text x="133" y="622" fill="#333333" font-size="9" font-family="Courier New, monospace">Frontier Coalition</text>

  <line x1="120" y1="633" x2="146" y2="633" stroke="#555555" stroke-width="1.2" stroke-dasharray="4,4"/>
