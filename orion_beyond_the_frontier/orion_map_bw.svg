  <text x="641" y="133" fill="black" font-size="12" font-family="Courier New, monospace" font-weight="bold">Capella</text>
  <text x="641" y="146" fill="#555555" font-size="9" font-family="Courier New, monospace">Frontier Coalition</text>

  <!-- Algol -->
  <rect x="715" y="174" width="9" height="9" fill="black"/>
  <text x="730" y="177" fill="#333333" font-size="10" font-family="Courier New, monospace">Algol</text>

