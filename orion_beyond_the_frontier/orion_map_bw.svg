  <text x="120" y="650" fill="#777777" font-size="9" font-family="Courier New, monospace">◆ Protected species world</text>

  <!-- ═══════════════════════════════════════════
       TITLE
       ═══════════════════════════════════════════ -->
  <text x="510" y="32" text-anchor="middle" fill="black" font-size="16" font-family="Courier New, monospace" font-weight="bold" letter-spacing="2">ORION'S ARM — HUMAN SPACE</text>
  <text x="510" y="50" text-anchor="middle" fill="#777777" font-size="9.5" font-family="Courier New, monospace" letter-spacing="3">c. 4000 CE  ·  SCHEMATIC — DISTANCES NOT TO SCALE</text>

  <!-- Footer -->
  <text x="510" y="685" text-anchor="middle" fill="#999999" font-size="8.5" font-family="Courier New, monospace">Dashed lines mark established travel routes · Jumpgates (Sirius Compact / IFMC–controlled) occupy strategic chokepoints</text>
</svg>
